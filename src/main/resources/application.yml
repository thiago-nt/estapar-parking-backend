server:
  port: 3003

spring:
  application:
    name: estapar-parking-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/estapar_parking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:estapar}
    password: ${DB_PASSWORD:estapar}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      group:
        readiness:
          include: readinessState,garageInitialization
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: Backend para gerenciamento de estacionamentos
    version: '@project.version@'

garage:
  simulator:
    enabled: ${GARAGE_SIMULATOR_ENABLED:true}
    base-url: ${GARAGE_SIMULATOR_URL:http://localhost:3000}
    connection-timeout: ${GARAGE_SIMULATOR_CONNECTION_TIMEOUT:2s}
    read-timeout: ${GARAGE_SIMULATOR_READ_TIMEOUT:5s}
    retry:
      max-attempts: ${GARAGE_SIMULATOR_RETRY_MAX_ATTEMPTS:3}
      backoff: ${GARAGE_SIMULATOR_RETRY_BACKOFF:1s}

revenue:
  zone-id: ${REVENUE_ZONE_ID:America/Sao_Paulo}
