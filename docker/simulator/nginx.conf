events {
    worker_connections 128;
}

http {
    log_format simulator_webhook '$remote_addr - $request '
                                 'status=$status upstream_status=$upstream_status '
                                 'request_time=$request_time upstream_time=$upstream_response_time';

    access_log /dev/stdout simulator_webhook;
    error_log /dev/stderr info;

    server {
        listen 3003;
        server_name localhost;

        location = /webhook {
            proxy_pass http://estapar-host-gateway:3003;
            proxy_http_version 1.1;
            proxy_pass_request_headers on;
            proxy_set_header Host localhost:3003;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto http;
            proxy_intercept_errors off;
        }

        location / {
            return 404;
        }
    }
}
